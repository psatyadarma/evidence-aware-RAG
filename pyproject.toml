[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-aware-sg-rag"
version = "0.1.0"
description = "Evaluation-first RAG with explicit evidence sufficiency checks"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic==2.13.5",
    "pydantic-settings==2.11.0",
    "streamlit==1.49.1",
]

[project.optional-dependencies]
evaluation = [
    "numpy==2.0.2",
    "sentence-transformers==3.4.1",
]
dev = [
    "numpy==2.0.2",
    "pytest==8.4.2",
    "sentence-transformers==3.4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*", "evaluation*"]
